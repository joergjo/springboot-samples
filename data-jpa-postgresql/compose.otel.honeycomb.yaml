services:
  springboot-app:
    environment:
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp

  collector:
    environment:
      - HONEYCOMB_API_KEY=${HONEYCOMB_API_KEY}
      - HONEYCOMB_DATASET=springboot-todo-api
    volumes:
      - type: bind
        source: ./otel-collector/config.honeycomb.yaml
        target: /conf/collector-config.yaml
        read_only: true
