version: "3.9"

services:
  springboot-app:
    environment:
      - OTEL_METRICS_EXPORTER=otlp

  collector:
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE}
    volumes:
      - type: bind
        source: ./otel-collector/config.datadog.yaml
        target: /conf/collector-config.yaml
        read_only: true
    ports:
      - "8889:8889"
